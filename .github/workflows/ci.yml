name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 全门禁（路径文档 / 资产 / 台账）
        run: node .workflow/scripts/gate-all.mjs
      - name: 提交说明门禁
        if: github.event_name == 'push'
        run: |
          git log -1 --pretty=%B > "$RUNNER_TEMP/commit-msg.txt"
          node .workflow/scripts/gate-commit-msg.mjs "$RUNNER_TEMP/commit-msg.txt"
      - name: PR 标题门禁（squash 合并会当作提交说明）
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          node .workflow/scripts/gate-commit-msg.mjs "$RUNNER_TEMP/pr-title.txt"

  build:
    name: 构建
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 探测工程脚手架
        id: probe
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "package.json 尚未建立（docs/TODO.md T-2），跳过构建"
          fi
      - name: 安装依赖
        if: steps.probe.outputs.ready == 'yes'
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: 类型检查
        if: steps.probe.outputs.ready == 'yes'
        run: npm run typecheck --if-present
      - name: 构建
        if: steps.probe.outputs.ready == 'yes'
        run: npm run build --if-present
      - name: 测试
        if: steps.probe.outputs.ready == 'yes'
        run: npm test --if-present
      - name: 上传 dist
        if: steps.probe.outputs.ready == 'yes' && hashFiles('dist/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          if-no-files-found: ignore
