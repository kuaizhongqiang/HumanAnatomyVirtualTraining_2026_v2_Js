name: release

# 发版通道：release/vX.Y.Z 分支的 PR 合并 → 校验版本 → 打 tag → 构建 → 挂 Release
# 另有两个补充入口：手动触发（补发/重跑）、已存在 tag 的 push（只重建产物）
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（v0.0.0 起，留空则取 package.json 的 version）'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: 校验并打 tag
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')) ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push')
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 拉全量 tag（版本比较需要）
        run: git fetch --tags --force origin
      - name: 门禁
        run: node .workflow/scripts/gate-all.mjs
      - name: 解析版本号
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            V="$REF_NAME"
          elif [ "$EVENT" = "pull_request" ]; then
            V="${PR_HEAD#release/}"
          else
            V="$INPUT_VERSION"
            if [ -z "$V" ] && [ -f package.json ]; then
              V="v$(node -p "require('./package.json').version")"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次版本：$V"
      - name: 校验版本（v0.0.0 起 / 单调递增 / 与 package.json 一致）
        shell: bash
        env:
          V: ${{ steps.resolve.outputs.version }}
        run: node .workflow/scripts/check-release-version.mjs "$V" --allow-existing
      - name: 打 tag（不存在才创建）
        id: create
        shell: bash
        env:
          V: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "created=no" >> "$GITHUB_OUTPUT"
            echo "tag $V 已存在，跳过创建"
          else
            git tag -a "$V" -m "$V"
            git push origin "$V"
            echo "created=yes" >> "$GITHUB_OUTPUT"
            echo "已创建并推送 tag $V"
          fi

  web:
    name: web（dist）
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 探测工程脚手架
        id: probe
        shell: bash
        run: |
          if [ -f package.json ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "ready=no" >> "$GITHUB_OUTPUT"; fi
      - name: 安装依赖
        if: steps.probe.outputs.ready == 'yes'
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: 构建 web
        if: steps.probe.outputs.ready == 'yes'
        run: npm run build --if-present
      - name: 上传 dist
        if: steps.probe.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          if-no-files-found: ignore

  desktop:
    name: desktop（Windows）
    runs-on: windows-latest
    needs: tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 探测工程脚手架
        id: probe
        shell: bash
        run: |
          if [ -f package.json ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "ready=no" >> "$GITHUB_OUTPUT"; fi
      - name: 安装依赖
        if: steps.probe.outputs.ready == 'yes'
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: 构建 web 产物
        if: steps.probe.outputs.ready == 'yes'
        run: npm run build --if-present
      - name: 打 Windows 安装包
        if: steps.probe.outputs.ready == 'yes'
        run: npx --yes electron-builder --win --publish never
      - name: 上传 release
        if: steps.probe.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: release/
          if-no-files-found: ignore

  publish:
    name: 挂到 Release
    runs-on: ubuntu-latest
    needs: [tag, web, desktop]
    if: needs.tag.outputs.version != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          name: ${{ needs.tag.outputs.version }}
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
