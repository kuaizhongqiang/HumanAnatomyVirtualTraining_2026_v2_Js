name: release

on:
  workflow_dispatch:
    inputs:
      target:
        description: 发布目标
        required: true
        default: all
        type: choice
        options: [web, desktop, all]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  web:
    name: web（dist）
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.target == 'web' || inputs.target == 'all'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 门禁
        run: node .workflow/scripts/gate-all.mjs
      - name: 探测工程脚手架
        id: probe
        shell: bash
        run: |
          if [ -f package.json ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "ready=no" >> "$GITHUB_OUTPUT"; fi
      - name: 安装依赖
        if: steps.probe.outputs.ready == 'yes'
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: 构建 web
        if: steps.probe.outputs.ready == 'yes'
        run: npm run build --if-present
      - name: 上传 dist
        if: steps.probe.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          if-no-files-found: ignore

  desktop:
    name: desktop（Windows）
    runs-on: windows-latest
    if: github.event_name == 'push' || inputs.target == 'desktop' || inputs.target == 'all'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 探测工程脚手架
        id: probe
        shell: bash
        run: |
          if [ -f package.json ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "ready=no" >> "$GITHUB_OUTPUT"; fi
      - name: 安装依赖
        if: steps.probe.outputs.ready == 'yes'
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: 构建 web 产物
        if: steps.probe.outputs.ready == 'yes'
        run: npm run build --if-present
      - name: 打 Windows 安装包
        if: steps.probe.outputs.ready == 'yes'
        run: npx --yes electron-builder --win --publish never
      - name: 上传 release
        if: steps.probe.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: release/
          if-no-files-found: ignore

  publish:
    name: 挂到 Release
    runs-on: ubuntu-latest
    needs: [web, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
